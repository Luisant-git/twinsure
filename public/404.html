<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 - Page Not Found | Twinsure</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <meta property="og:title" content="Twinsure - Page Not Found" />
    <meta property="og:description" content="It’s not about having policy—it’s about knowing when it matters." />
    <meta property="og:image" content="assets/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="assets/logo.png" />
    <style>
      .logo img.site-logo, .logo img { height: 34px !important; width: auto !important; max-height: 40px; }
      .footer-logo-img { height: 28px !important; width: auto !important; max-height: 32px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      as="style"
      onload="((this.onload = null), (this.rel = 'stylesheet'))"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    /></noscript>
    <style>
      :root {
        --primary-dark: #001533;
        --primary-mid: #00296b;
        --primary-light: #003f88;
        --accent-gold: #fdc500;
        --accent-gold-light: #ffd500;
        --text-white: #f8fafc;
        --text-gray: #cbd5e1;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Inter, sans-serif;
        background-color: var(--primary-dark);
        color: var(--text-white);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      h1,
      h2,
      h3 {
        font-family: Outfit, sans-serif;
      }
      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
        opacity: 0.6;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          rgba(0, 21, 51, 0.4) 0,
          rgba(0, 21, 51, 0.8) 100%
        );
        z-index: -1;
      }
      .error-container {
        text-align: center;
        z-index: 10;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        padding: 4rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        max-width: 600px;
        width: 90%;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .error-code {
        font-size: 8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          var(--accent-gold-light),
          var(--accent-gold)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(253, 197, 0, 0.3);
      }
      .error-title {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      .error-msg {
        color: var(--text-gray);
        font-size: 1.1rem;
        margin-bottom: 2.5rem;
        line-height: 1.6;
      }
      .btn {
        padding: 1rem 2.5rem;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        text-decoration: none;
        font-size: 1.1rem;
      }
      .btn-gold {
        background: linear-gradient(
          135deg,
          var(--accent-gold-light),
          var(--accent-gold)
        );
        color: var(--primary-dark);
        border: none;
        box-shadow: 0 4px 15px rgba(253, 197, 0, 0.3);
      }
      .btn-gold:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(253, 197, 0, 0.5);
      }
      .logo {
        position: absolute;
        top: 2rem;
        left: 3rem;
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text-white);
        font-family: Outfit;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
      }
      .logo i {
        color: var(--accent-gold);
      }
      @media (max-width: 768px) {
        .error-code {
          font-size: 6rem;
        }
        .error-container {
          padding: 3rem 2rem;
        }
        .logo {
          top: 1.5rem;
          left: 1.5rem;
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="logo"
      ><i class="fas fa-shield-alt"></i> Twinsure</a
    ><video class="video-bg" autoplay loop muted playsinline>
      <source src="assets/notfound.mp4" type="video/mp4" />
      <source src="assets/notfound.mpf" type="video/mp4" />
    </video>
    <div class="overlay"></div>
    <div class="error-container">
      <div class="error-code">404</div>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-msg">
        The link you followed may be broken, or the page may have been removed.
        Don't worry, our AI is working to keep things on track.
      </p>
      <a href="index.html" class="btn btn-gold" style="margin-bottom: 2rem;"
        ><i class="fas fa-home"></i> Return to Safety</a
      >

      <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; margin-top: 1rem;">
        <p style="font-size: 0.9rem; color: var(--text-gray); margin-bottom: 0.8rem;">Subscribe to our newsletter for updates:</p>
        <form class="newsletter-form" onsubmit="handleNewsletterSubmit(event, this)" style="display: flex; gap: 8px; max-width: 400px; margin: 0 auto; flex-direction: column;">
          <div style="display: flex; gap: 8px;">
            <input type="email" name="email" placeholder="Your email address..." required style="flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; outline: none; font-size: 0.9rem;" />
            <button type="submit" style="padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent-gold); color: #000; font-weight: 700; cursor: pointer;">
              Subscribe
            </button>
          </div>
          <div class="newsletter-msg" style="font-size: 0.82rem; margin-top: 4px;"></div>
        </form>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/newsletter.js"></script>
  </body>
</html>
