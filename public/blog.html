<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog and Insights | TwinSure</title>
  <meta name="description" content="Read expert articles from TwinSure on health insurance, claim tips, policy advice, and financial planning in Tamil Nadu." />
  <link rel="canonical" href="https://www.twinsure.in/blog" />
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.twinsure.in/blog" />
  <meta property="og:title" content="Blog and Insights | TwinSure" />
  <meta property="og:image" content="https://www.twinsure.in/assets/logo.png" />
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>
  <link rel="stylesheet" href="/css/fonts.css" />
  <script src="/js/config.js"></script>
  <style>
    :root{--primary-dark:#001533;--primary-mid:#00296b;--primary-light:#003f88;--accent-gold:#fdc500;--accent-gold-light:#ffd500;--text-white:#ffffff;--text-gray:#94a3b8;--glass-bg:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);}
    *{margin:0;padding:0;box-sizing:border-box;}html,body{width:100%;overflow-x:clip;}
    body{font-family:Montserrat,sans-serif;background-color:var(--primary-dark);color:var(--text-white);background-image:radial-gradient(rgba(255,255,255,0.06) 1.5px,transparent 1.5px),radial-gradient(rgba(253,197,0,0.06) 1.5px,transparent 1.5px),linear-gradient(135deg,rgba(255,255,255,0.015) 25%,transparent 25%,transparent 50%,rgba(255,255,255,0.015) 50%,rgba(255,255,255,0.015) 75%,transparent 75%,transparent);background-size:30px 30px,45px 45px,120px 120px;background-position:0 0,15px 15px,0 0;animation:patternFloat 45s linear infinite;}
    @keyframes patternFloat{0%{background-position:0 0,15px 15px,0 0;}100%{background-position:300px 300px,-300px 330px,600px 600px;}}
    a{text-decoration:none;}ul{list-style:none;}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1.2rem 5%;display:flex;justify-content:space-between;align-items:center;background:rgba(0,21,51,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);transition:all 0.3s;}
    .logo{display:flex;align-items:center;gap:0.5rem;color:var(--accent-gold);font-size:1.4rem;font-weight:800;}
    .logo img{height:30px;}
    .nav-links{display:flex;gap:2rem;align-items:center;}
    .nav-links a{color:var(--text-gray);font-size:0.9rem;font-weight:500;transition:color 0.2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--accent-gold);}
    .nav-cta{background:var(--accent-gold);color:#000;padding:0.6rem 1.4rem;border-radius:50px;font-weight:700;font-size:0.85rem;transition:all 0.3s;}
    .nav-cta:hover{background:var(--accent-gold-light);transform:translateY(-1px);}
    .hamburger{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;}
    @media(max-width:768px){.nav-links{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:rgba(0,21,51,0.97);padding:1.5rem 5%;gap:1.2rem;border-top:1px solid var(--glass-border);}.nav-links.open{display:flex;}.hamburger{display:block;}}
    .breadcrumbs{display:inline-flex;align-items:center;gap:0.45rem;font-size:0.8rem;color:var(--text-gray);margin-bottom:0.75rem;}
    .breadcrumbs a{color:var(--text-gray);transition:color 0.2s;}
    .breadcrumbs a:hover{color:var(--accent-gold);}
    .breadcrumbs .sep{opacity:0.35;}
    .breadcrumbs .current{color:var(--accent-gold);font-weight:600;}
    .blog-hero{padding:6.8rem 5% 2.8rem;background:linear-gradient(135deg,rgba(0,41,107,0.45),rgba(0,63,136,0.25));border-bottom:1px solid var(--glass-border);}
    .blog-hero-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:2.5rem;flex-wrap:wrap;}
    .blog-hero-left{flex:1;min-width:300px;max-width:620px;}
    .blog-hero h1{font-size:clamp(2rem,3.4vw,2.8rem);font-weight:800;line-height:1.2;margin-bottom:0.6rem;letter-spacing:-0.5px;}
    .blog-hero h1 span{background:linear-gradient(135deg,var(--accent-gold-light),var(--accent-gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .blog-hero p{color:var(--text-gray);font-size:0.95rem;line-height:1.65;}
    .blog-hero-right{width:100%;max-width:400px;}
    .blog-search-bar{width:100%;display:flex;align-items:center;border-radius:50px;overflow:hidden;background:rgba(255,255,255,0.07);border:1px solid rgba(253,197,0,0.3);box-shadow:0 6px 25px rgba(0,0,0,0.25);transition:all 0.3s;padding:3px 3px 3px 1.2rem;}
    .blog-search-bar:focus-within{border-color:var(--accent-gold);background:rgba(255,255,255,0.12);box-shadow:0 8px 30px rgba(253,197,0,0.25);}
    .blog-search-bar .search-icon{color:var(--accent-gold);font-size:0.9rem;margin-right:0.6rem;}
    .blog-search-bar input{flex:1;background:none;border:none;padding:0.75rem 0;color:#fff;font-size:0.9rem;outline:none;}
    .blog-search-bar input::placeholder{color:rgba(255,255,255,0.45);}
    .blog-search-bar button{background:var(--accent-gold);border:none;padding:0.75rem 1.4rem;color:#000;font-weight:700;cursor:pointer;font-size:0.88rem;border-radius:50px;transition:all 0.2s;white-space:nowrap;}
    .blog-search-bar button:hover{background:var(--accent-gold-light);transform:scale(1.02);}
    .blog-main{max-width:1200px;margin:0 auto;padding:3rem 5% 5rem;}
    .category-pills{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:2.5rem;}
    .category-pill{padding:0.4rem 1.1rem;border-radius:50px;font-size:0.8rem;font-weight:600;border:1px solid var(--glass-border);color:var(--text-gray);background:var(--glass-bg);cursor:pointer;transition:all 0.2s;}
    .category-pill:hover,.category-pill.active{background:var(--accent-gold);color:#000;border-color:var(--accent-gold);}
    .blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2rem;}
    .blog-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;overflow:hidden;transition:transform 0.3s,box-shadow 0.3s,border-color 0.3s;display:flex;flex-direction:column;position:relative;}
    .blog-card:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,0.4);border-color:rgba(253,197,0,0.3);}
    .blog-card.no-cover{border-top:4px solid var(--accent-gold);}
    .card-image-wrap{display:block;width:100%;height:200px;overflow:hidden;background:rgba(0,21,51,0.5);}
    .card-image{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s;}
    .blog-card:hover .card-image{transform:scale(1.04);}
    .card-body{padding:1.5rem;flex:1;display:flex;flex-direction:column;gap:0.75rem;}
    .card-meta{display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;}
    .card-category{background:rgba(253,197,0,0.15);color:var(--accent-gold);font-size:0.72rem;font-weight:700;padding:0.25rem 0.75rem;border-radius:50px;text-transform:uppercase;letter-spacing:0.5px;}
    .card-date{font-size:0.75rem;color:var(--text-gray);}
    .card-title{font-size:1.05rem;font-weight:800;color:var(--text-white);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-excerpt{font-size:0.85rem;color:var(--text-gray);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:0.5rem;}
    .card-author{display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;color:var(--text-gray);}
    .card-author-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-mid);border:1px solid rgba(253,197,0,0.3);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--accent-gold);font-weight:700;}
    .card-read-more{display:inline-flex;align-items:center;gap:0.4rem;color:var(--accent-gold);font-size:0.82rem;font-weight:700;transition:gap 0.2s;}
    .blog-card:hover .card-read-more{gap:0.7rem;}
    .card-tags{display:flex;flex-wrap:wrap;gap:0.4rem;}
    .card-tag{font-size:0.7rem;color:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.12);padding:0.15rem 0.55rem;border-radius:20px;}
    .blog-empty{text-align:center;padding:5rem 2rem;color:var(--text-gray);grid-column:1/-1;}
    .blog-empty i{font-size:3rem;margin-bottom:1rem;display:block;opacity:0.4;}
    .blog-empty h3{font-size:1.2rem;color:rgba(255,255,255,0.6);margin-bottom:0.5rem;}
    .blog-spinner{display:flex;align-items:center;justify-content:center;padding:5rem;grid-column:1/-1;}
    .spinner-ring{width:48px;height:48px;border:4px solid rgba(253,197,0,0.2);border-top-color:var(--accent-gold);border-radius:50%;animation:spin 0.9s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    footer{background:rgba(0,0,0,0.35);border-top:1px solid var(--glass-border);padding:2rem 5%;text-align:center;color:var(--text-gray);font-size:0.85rem;}
    footer a{color:var(--accent-gold);}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><img src="assets/logo.png" alt="Twinsure" /> Twinsure</a>
    <button class="hamburger" id="hamburger" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="nav-cta">Login</a>
    </div>
  </nav>

  <section class="blog-hero">
    <div class="blog-hero-inner">
      <div class="blog-hero-left">
        <div class="breadcrumbs">
          <a href="index.html"><i class="fas fa-home"></i> Home</a>
          <span class="sep">/</span>
          <span class="current">Blog</span>
        </div>
        <h1>Our <span>Blog</span></h1>
        <p>Expert advice on health insurance, claim strategies, policy tips, and financial wellness from the TwinSure team.</p>
      </div>
      <div class="blog-hero-right">
        <div class="blog-search-bar">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Search articles, topics..." oninput="handleSearch()" />
          <button onclick="handleSearch()">Search</button>
        </div>
      </div>
    </div>
  </section>

  <main class="blog-main">
    <div class="category-pills" id="categoryPills">
      <button class="category-pill active" onclick="filterCategory('all', this)">All</button>
    </div>
    <div class="blog-grid" id="blogGrid">
      <div class="blog-spinner"><div class="spinner-ring"></div></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 TwinSure. All rights reserved. &nbsp;|&nbsp; <a href="privacy.html">Privacy Policy</a> &nbsp;|&nbsp; <a href="terms.html">Terms</a></p>
  </footer>

  <script>
    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('open');
    });

    var BASE_URL = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '/backend/api';
    var allPosts = [];
    var currentCategory = 'all';
    var currentSearch = '';

    async function loadBlogPosts() {
      try {
        var res = await fetch(BASE_URL + '/blogs');
        var data = await res.json();
        allPosts = (data && data.posts) ? data.posts : [];
        buildCategoryPills();
        renderPosts();
      } catch (err) {
        document.getElementById('blogGrid').innerHTML = '<div class="blog-empty"><i class="fas fa-exclamation-circle"></i><h3>Could not load articles</h3><p>Please try again later.</p></div>';
      }
    }

    function buildCategoryPills() {
      var cats = ['all'];
      allPosts.forEach(function(p) { var c = p.category || 'General'; if (!cats.includes(c)) cats.push(c); });
      var pillsEl = document.getElementById('categoryPills');
      if (!pillsEl) return;
      pillsEl.innerHTML = cats.map(function(c, i) {
        return '<button class="category-pill' + (i === 0 ? ' active' : '') + '" onclick="filterCategory(\'' + c.replace(/'/g, "\\'") + '\', this)">' + (c === 'all' ? 'All' : escHtml(c)) + '</button>';
      }).join('');
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.category-pill').forEach(function(p) { p.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      renderPosts();
    }

    function handleSearch() {
      var el = document.getElementById('searchInput');
      currentSearch = el ? el.value.toLowerCase().trim() : '';
      renderPosts();
    }

    function renderPosts() {
      var grid = document.getElementById('blogGrid');
      if (!grid) return;
      var filtered = allPosts.filter(function(p) {
        var matchCat = currentCategory === 'all' || (p.category || 'General') === currentCategory;
        var matchSearch = !currentSearch || (p.title || '').toLowerCase().includes(currentSearch) || (p.excerpt || '').toLowerCase().includes(currentSearch);
        return matchCat && matchSearch;
      });
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="blog-empty"><i class="fas fa-search"></i><h3>No articles found</h3><p>Try a different search or category.</p></div>';
        return;
      }
      grid.innerHTML = filtered.map(function(post) {
        var dateStr = '';
        if (post.publishedAt) dateStr = new Date(post.publishedAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
        else if (post.createdAt) dateStr = new Date(post.createdAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
        var slug = encodeURIComponent(post.slug);
        var hasCover = !!(post.coverImage && post.coverImage.trim());
        var coverHtml = hasCover
          ? '<a href="blog-post.html?slug=' + slug + '" class="card-image-wrap"><img class="card-image" src="' + escHtml(post.coverImage.trim()) + '" alt="' + escHtml(post.title) + '" loading="lazy" onerror="var p=this.closest(\'.blog-card\');if(p)p.classList.add(\'no-cover\');this.closest(\'.card-image-wrap\').remove();" /></a>'
          : '';
        var cardClass = 'blog-card' + (hasCover ? '' : ' no-cover');
        var tagsHtml = '';
        if (post.tags && Array.isArray(post.tags) && post.tags.length) {
          var validTags = post.tags.filter(function(t){ return t && String(t).trim(); });
          if (validTags.length) {
            tagsHtml = '<div class="card-tags">' + validTags.slice(0,4).map(function(t){ return '<span class="card-tag">' + escHtml(String(t).trim()) + '</span>'; }).join('') + '</div>';
          }
        }
        var authorName = post.author && post.author.trim() ? post.author.trim() : 'TwinSure Team';
        var authorInitials = authorName.split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2) || 'TS';
        var excerptHtml = post.excerpt && post.excerpt.trim() ? '<p class="card-excerpt">' + escHtml(post.excerpt.trim()) + '</p>' : '';

        return '<article class="' + cardClass + '">' +
          coverHtml +
          '<div class="card-body">' +
            '<div class="card-meta">' +
              '<span class="card-category">' + escHtml(post.category || 'General') + '</span>' +
              (dateStr ? '<span class="card-date"><i class="far fa-calendar-alt" style="margin-right:3px;"></i>' + dateStr + '</span>' : '') +
            '</div>' +
            '<a href="blog-post.html?slug=' + slug + '"><h2 class="card-title">' + escHtml(post.title) + '</h2></a>' +
            excerptHtml +
            tagsHtml +
            '<div class="card-footer">' +
              '<div class="card-author">' +
                '<div class="card-author-avatar">' + authorInitials + '</div>' +
                '<span>' + escHtml(authorName) + '</span>' +
              '</div>' +
              '<a href="blog-post.html?slug=' + slug + '" class="card-read-more">Read <i class="fas fa-arrow-right"></i></a>' +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadBlogPosts();
  </script>
</body>
</html>
